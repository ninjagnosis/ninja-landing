<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-label="Where the money has to travel"><rect width="1200" height="360" fill="#f6f5f1"/><text x="40" y="56" font-family="Helvetica,Arial,sans-serif" font-size="28" font-weight="700" fill="#1f2a24">Where the money has to travel</text><rect x="40.0" y="100" width="250.0" height="220" rx="10" fill="#ffffff" stroke="#c9c6bb"/><text x="60.0" y="150" font-family="Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#1f5a3a">1. Customer</text><text x="60.0" y="190" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#333">Pays in USD or</text><text x="60.0" y="220" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#333">another currency.</text><path d="M298.0 210 h24 m-8 -8 l8 8 l-8 8" fill="none" stroke="#1f5a3a" stroke-width="3"/><rect x="330.0" y="100" width="250.0" height="220" rx="10" fill="#ffffff" stroke="#c9c6bb"/><text x="350.0" y="150" font-family="Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#1f5a3a">2. Collector</text><text x="350.0" y="190" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#333">Platform or bank</text><text x="350.0" y="220" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#333">that receives</text><text x="350.0" y="250" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#333">the payment.</text><path d="M588.0 210 h24 m-8 -8 l8 8 l-8 8" fill="none" stroke="#1f5a3a" stroke-width="3"/><rect x="620.0" y="100" width="250.0" height="220" rx="10" fill="#ffffff" stroke="#c9c6bb"/><text x="640.0" y="150" font-family="Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#1f5a3a">3. Nepal bank</text><text x="640.0" y="190" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#333">Licensed bank that</text><text x="640.0" y="220" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#333">converts or holds</text><text x="640.0" y="250" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#333">the funds.</text><path d="M878.0 210 h24 m-8 -8 l8 8 l-8 8" fill="none" stroke="#1f5a3a" stroke-width="3"/><rect x="910.0" y="100" width="250.0" height="220" rx="10" fill="#ffffff" stroke="#c9c6bb"/><text x="930.0" y="150" font-family="Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#1f5a3a">4. Your books</text><text x="930.0" y="190" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#333">Invoice, receipt</text><text x="930.0" y="220" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#333">and tax record.</text></svg>