<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-label="From selling hours to selling a product"><rect width="1200" height="360" fill="#f6f5f1"/><text x="40" y="56" font-family="Helvetica,Arial,sans-serif" font-size="28" font-weight="700" fill="#1f2a24">From selling hours to selling a product</text><rect x="40.0" y="100" width="346.6666666666667" height="220" rx="10" fill="#ffffff" stroke="#c9c6bb"/><text x="60.0" y="150" font-family="Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#1f5a3a">1. Hours</text><text x="60.0" y="190" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#333">Clients pay per</text><text x="60.0" y="220" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#333">developer-month.</text><text x="60.0" y="250" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#333">Revenue grows with</text><text x="60.0" y="280" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#333">headcount.</text><path d="M394.6666666666667 210 h24 m-8 -8 l8 8 l-8 8" fill="none" stroke="#1f5a3a" stroke-width="3"/><rect x="426.6666666666667" y="100" width="346.6666666666667" height="220" rx="10" fill="#ffffff" stroke="#c9c6bb"/><text x="446.6666666666667" y="150" font-family="Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#1f5a3a">2. Project</text><text x="446.6666666666667" y="190" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#333">Fixed scope and</text><text x="446.6666666666667" y="220" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#333">price. You keep</text><text x="446.6666666666667" y="250" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#333">some reusable</text><text x="446.6666666666667" y="280" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#333">code.</text><path d="M781.3333333333334 210 h24 m-8 -8 l8 8 l-8 8" fill="none" stroke="#1f5a3a" stroke-width="3"/><rect x="813.3333333333334" y="100" width="346.6666666666667" height="220" rx="10" fill="#ffffff" stroke="#c9c6bb"/><text x="833.3333333333334" y="150" font-family="Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#1f5a3a">3. Product</text><text x="833.3333333333334" y="190" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#333">Many customers pay</text><text x="833.3333333333334" y="220" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#333">for the same code.</text><text x="833.3333333333334" y="250" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#333">Revenue can grow</text><text x="833.3333333333334" y="280" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#333">faster than staff.</text></svg>