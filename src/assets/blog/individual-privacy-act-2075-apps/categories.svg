<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-label="Section 12(4): eight kinds of data you may not pass on without consent"><rect width="1200" height="420" fill="#f6f5f1"/><text x="40" y="56" font-family="Helvetica,Arial,sans-serif" font-size="28" font-weight="700" fill="#1f2a24">Section 12(4): eight kinds of data you may not pass on without consent</text><rect x="40" y="100" width="560" height="54" rx="10" fill="#ffffff" stroke="#c9c6bb"/><text x="60" y="134" font-family="Helvetica,Arial,sans-serif" font-size="22" fill="#333">1. Health examination details</text><rect x="620" y="100" width="560" height="54" rx="10" fill="#ffffff" stroke="#c9c6bb"/><text x="640" y="134" font-family="Helvetica,Arial,sans-serif" font-size="22" fill="#333">2. Property and income details</text><rect x="40" y="170" width="560" height="54" rx="10" fill="#ffffff" stroke="#c9c6bb"/><text x="60" y="204" font-family="Helvetica,Arial,sans-serif" font-size="22" fill="#333">3. Employment details</text><rect x="620" y="170" width="560" height="54" rx="10" fill="#ffffff" stroke="#c9c6bb"/><text x="640" y="204" font-family="Helvetica,Arial,sans-serif" font-size="22" fill="#333">4. Family matters</text><rect x="40" y="240" width="560" height="54" rx="10" fill="#ffffff" stroke="#c9c6bb"/><text x="60" y="274" font-family="Helvetica,Arial,sans-serif" font-size="22" fill="#333">5. Biometric details and thumb impression</text><rect x="620" y="240" width="560" height="54" rx="10" fill="#ffffff" stroke="#c9c6bb"/><text x="640" y="274" font-family="Helvetica,Arial,sans-serif" font-size="22" fill="#333">6. Signature or electronic signature</text><rect x="40" y="310" width="560" height="54" rx="10" fill="#ffffff" stroke="#c9c6bb"/><text x="60" y="344" font-family="Helvetica,Arial,sans-serif" font-size="22" fill="#333">7. Political affiliation and election</text><rect x="620" y="310" width="560" height="54" rx="10" fill="#ffffff" stroke="#c9c6bb"/><text x="640" y="344" font-family="Helvetica,Arial,sans-serif" font-size="22" fill="#333">8. Business or transaction details</text></svg>