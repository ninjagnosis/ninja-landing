<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-label="Three things a Nepal SaaS has to settle"><rect width="1200" height="360" fill="#f6f5f1"/><text x="40" y="56" font-family="Helvetica,Arial,sans-serif" font-size="28" font-weight="700" fill="#1f2a24">Three things a Nepal SaaS has to settle</text><rect x="40.0" y="100" width="346.6666666666667" height="220" rx="10" fill="#ffffff" stroke="#c9c6bb"/><text x="60.0" y="150" font-family="Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#1f5a3a">1. Payments</text><text x="60.0" y="190" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#333">How you charge</text><text x="60.0" y="220" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#333">Nepali and foreign</text><text x="60.0" y="250" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#333">customers.</text><path d="M394.6666666666667 210 h24 m-8 -8 l8 8 l-8 8" fill="none" stroke="#1f5a3a" stroke-width="3"/><rect x="426.6666666666667" y="100" width="346.6666666666667" height="220" rx="10" fill="#ffffff" stroke="#c9c6bb"/><text x="446.6666666666667" y="150" font-family="Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#1f5a3a">2. Hosting</text><text x="446.6666666666667" y="190" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#333">Where data lives</text><text x="446.6666666666667" y="220" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#333">and who can</text><text x="446.6666666666667" y="250" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#333">reach it.</text><path d="M781.3333333333334 210 h24 m-8 -8 l8 8 l-8 8" fill="none" stroke="#1f5a3a" stroke-width="3"/><rect x="813.3333333333334" y="100" width="346.6666666666667" height="220" rx="10" fill="#ffffff" stroke="#c9c6bb"/><text x="833.3333333333334" y="150" font-family="Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#1f5a3a">3. Law</text><text x="833.3333333333334" y="190" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#333">Company, tax and</text><text x="833.3333333333334" y="220" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#333">privacy duties</text><text x="833.3333333333334" y="250" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#333">from day one.</text></svg>