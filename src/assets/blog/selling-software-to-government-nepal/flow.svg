<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-label="The path of a public tender"><rect width="1200" height="360" fill="#f6f5f1"/><text x="40" y="56" font-family="Helvetica,Arial,sans-serif" font-size="28" font-weight="700" fill="#1f2a24">The path of a public tender</text><rect x="40.0" y="100" width="250.0" height="220" rx="10" fill="#ffffff" stroke="#c9c6bb"/><text x="60.0" y="150" font-family="Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#1f5a3a">1. Notice</text><text x="60.0" y="190" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#333">Entity publishes</text><text x="60.0" y="220" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#333">the tender and</text><text x="60.0" y="250" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#333">bidding document.</text><path d="M298.0 210 h24 m-8 -8 l8 8 l-8 8" fill="none" stroke="#1f5a3a" stroke-width="3"/><rect x="330.0" y="100" width="250.0" height="220" rx="10" fill="#ffffff" stroke="#c9c6bb"/><text x="350.0" y="150" font-family="Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#1f5a3a">2. Bid</text><text x="350.0" y="190" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#333">You submit bid</text><text x="350.0" y="220" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#333">and bid security</text><text x="350.0" y="250" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#333">before the date.</text><path d="M588.0 210 h24 m-8 -8 l8 8 l-8 8" fill="none" stroke="#1f5a3a" stroke-width="3"/><rect x="620.0" y="100" width="250.0" height="220" rx="10" fill="#ffffff" stroke="#c9c6bb"/><text x="640.0" y="150" font-family="Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#1f5a3a">3. Evaluate</text><text x="640.0" y="190" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#333">Entity checks</text><text x="640.0" y="220" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#333">eligibility, then</text><text x="640.0" y="250" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#333">price.</text><path d="M878.0 210 h24 m-8 -8 l8 8 l-8 8" fill="none" stroke="#1f5a3a" stroke-width="3"/><rect x="910.0" y="100" width="250.0" height="220" rx="10" fill="#ffffff" stroke="#c9c6bb"/><text x="930.0" y="150" font-family="Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#1f5a3a">4. Contract</text><text x="930.0" y="190" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#333">Award, contract,</text><text x="930.0" y="220" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#333">performance</text><text x="930.0" y="250" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#333">security.</text></svg>