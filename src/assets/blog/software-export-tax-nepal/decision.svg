<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" role="img" aria-label="VAT Schedule 2 item 2: two routes to zero-rating"><rect width="1200" height="380" fill="#f6f5f1"/><text x="40" y="56" font-family="Helvetica,Arial,sans-serif" font-size="28" font-weight="700" fill="#1f2a24">VAT Schedule 2, item 2: either route zero-rates the supply</text><rect x="40.0" y="100" width="326.6666666666667" height="250" rx="10" fill="#ffffff" stroke="#c9c6bb"/><text x="56.0" y="145" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="700" fill="#1f5a3a">Item 2(a)</text><text x="56.0" y="185" font-family="Helvetica,Arial,sans-serif" font-size="19" fill="#333">Service by a Nepali resident</text><text x="56.0" y="213" font-family="Helvetica,Arial,sans-serif" font-size="19" fill="#333">to a person outside Nepal</text><text x="56.0" y="241" font-family="Helvetica,Arial,sans-serif" font-size="19" fill="#333">who has no business</text><text x="56.0" y="269" font-family="Helvetica,Arial,sans-serif" font-size="19" fill="#333">transaction, representative</text><text x="56.0" y="297" font-family="Helvetica,Arial,sans-serif" font-size="19" fill="#333">or agent in Nepal</text><rect x="436.6666666666667" y="100" width="326.6666666666667" height="250" rx="10" fill="#ffffff" stroke="#c9c6bb"/><text x="452.6666666666667" y="145" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="700" fill="#1f5a3a">Item 2(b)</text><text x="452.6666666666667" y="185" font-family="Helvetica,Arial,sans-serif" font-size="19" fill="#333">Goods or services supplied</text><text x="452.6666666666667" y="213" font-family="Helvetica,Arial,sans-serif" font-size="19" fill="#333">by a registered resident of</text><text x="452.6666666666667" y="241" font-family="Helvetica,Arial,sans-serif" font-size="19" fill="#333">Nepal to a person residing</text><text x="452.6666666666667" y="269" font-family="Helvetica,Arial,sans-serif" font-size="19" fill="#333">outside Nepal</text><rect x="833.3333333333334" y="100" width="326.6666666666667" height="250" rx="10" fill="#e8f0ea" stroke="#c9c6bb"/><text x="849.3333333333334" y="145" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="700" fill="#1f5a3a">Zero-rated</text><text x="849.3333333333334" y="185" font-family="Helvetica,Arial,sans-serif" font-size="19" fill="#333">0% output VAT. Input credit</text><text x="849.3333333333334" y="213" font-family="Helvetica,Arial,sans-serif" font-size="19" fill="#333">may be kept for a zero-rated</text><text x="849.3333333333334" y="241" font-family="Helvetica,Arial,sans-serif" font-size="19" fill="#333">supplier</text><text x="374.6666666666667" y="230" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#1f5a3a">or</text><path d="M703.3333333333334 225 h50 m-10 -10 l10 10 l-10 10" fill="none" stroke="#1f5a3a" stroke-width="3"/></svg>