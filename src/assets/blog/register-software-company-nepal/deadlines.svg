<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-label="After the certificate: what OCR expects and when"><rect width="1200" height="360" fill="#f6f5f1"/><text x="40" y="56" font-family="Helvetica,Arial,sans-serif" font-size="28" font-weight="700" fill="#1f2a24">After the certificate: what OCR expects and when</text><rect x="40.0" y="100" width="208.0" height="220" rx="10" fill="#ffffff" stroke="#c9c6bb"/><text x="56.0" y="145" font-family="Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#1f5a3a">Day 0</text><text x="56.0" y="185" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#333">Registration</text><text x="56.0" y="215" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#333">certificate issued</text><rect x="268.0" y="100" width="208.0" height="220" rx="10" fill="#ffffff" stroke="#c9c6bb"/><text x="284.0" y="145" font-family="Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#1f5a3a">15 days</text><text x="284.0" y="185" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#333">Auditor</text><text x="284.0" y="215" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#333">appointment and</text><text x="284.0" y="245" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#333">directors register</text><text x="284.0" y="275" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#333">filed</text><rect x="496.0" y="100" width="208.0" height="220" rx="10" fill="#ffffff" stroke="#c9c6bb"/><text x="512.0" y="145" font-family="Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#1f5a3a">15 days + 7</text><text x="512.0" y="185" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#333">Directors</text><text x="512.0" y="215" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#333">declaration</text><text x="512.0" y="245" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#333">reaches OCR</text><rect x="724.0" y="100" width="208.0" height="220" rx="10" fill="#ffffff" stroke="#c9c6bb"/><text x="740.0" y="145" font-family="Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#1f5a3a">30 days</text><text x="740.0" y="185" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#333">Full registered</text><text x="740.0" y="215" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#333">address filed</text><rect x="952.0" y="100" width="208.0" height="220" rx="10" fill="#ffffff" stroke="#c9c6bb"/><text x="968.0" y="145" font-family="Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#1f5a3a">Poush</text><text x="968.0" y="185" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#333">AGM held, minutes</text><text x="968.0" y="215" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#333">and audit report</text><text x="968.0" y="245" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#333">filed</text></svg>