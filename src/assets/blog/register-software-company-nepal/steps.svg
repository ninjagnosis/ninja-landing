<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-label="Registration in order"><rect width="1200" height="360" fill="#f6f5f1"/><text x="40" y="56" font-family="Helvetica,Arial,sans-serif" font-size="28" font-weight="700" fill="#1f2a24">Registration in order</text><rect x="40.0" y="100" width="250.0" height="220" rx="10" fill="#ffffff" stroke="#c9c6bb"/><text x="60.0" y="150" font-family="Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#1f5a3a">1. Name</text><text x="60.0" y="190" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#333">Reserve the</text><text x="60.0" y="220" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#333">company name</text><text x="60.0" y="250" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#333">at OCR.</text><path d="M298.0 210 h24 m-8 -8 l8 8 l-8 8" fill="none" stroke="#1f5a3a" stroke-width="3"/><rect x="330.0" y="100" width="250.0" height="220" rx="10" fill="#ffffff" stroke="#c9c6bb"/><text x="350.0" y="150" font-family="Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#1f5a3a">2. File</text><text x="350.0" y="190" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#333">Submit MOA,</text><text x="350.0" y="220" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#333">AOA and fee.</text><path d="M588.0 210 h24 m-8 -8 l8 8 l-8 8" fill="none" stroke="#1f5a3a" stroke-width="3"/><rect x="620.0" y="100" width="250.0" height="220" rx="10" fill="#ffffff" stroke="#c9c6bb"/><text x="640.0" y="150" font-family="Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#1f5a3a">3. Certificate</text><text x="640.0" y="190" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#333">OCR issues the</text><text x="640.0" y="220" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#333">registration</text><text x="640.0" y="250" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#333">certificate.</text><path d="M878.0 210 h24 m-8 -8 l8 8 l-8 8" fill="none" stroke="#1f5a3a" stroke-width="3"/><rect x="910.0" y="100" width="250.0" height="220" rx="10" fill="#ffffff" stroke="#c9c6bb"/><text x="930.0" y="150" font-family="Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#1f5a3a">4. Tax</text><text x="930.0" y="190" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#333">PAN, then VAT</text><text x="930.0" y="220" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#333">if required, at</text><text x="930.0" y="250" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#333">the tax office.</text></svg>