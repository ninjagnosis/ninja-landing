<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-label="The three-year certification cycle"><rect width="1200" height="360" fill="#f6f5f1"/><text x="40" y="56" font-family="Helvetica,Arial,sans-serif" font-size="28" font-weight="700" fill="#1f2a24">The three-year certification cycle</text><rect x="40.0" y="100" width="250.0" height="220" rx="10" fill="#ffffff" stroke="#c9c6bb"/><text x="60.0" y="150" font-family="Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#1f5a3a">1. Stage 1</text><text x="60.0" y="190" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#333">Auditor reviews</text><text x="60.0" y="220" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#333">your documents.</text><path d="M298.0 210 h24 m-8 -8 l8 8 l-8 8" fill="none" stroke="#1f5a3a" stroke-width="3"/><rect x="330.0" y="100" width="250.0" height="220" rx="10" fill="#ffffff" stroke="#c9c6bb"/><text x="350.0" y="150" font-family="Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#1f5a3a">2. Stage 2</text><text x="350.0" y="190" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#333">Auditor checks it</text><text x="350.0" y="220" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#333">works in practice.</text><path d="M588.0 210 h24 m-8 -8 l8 8 l-8 8" fill="none" stroke="#1f5a3a" stroke-width="3"/><rect x="620.0" y="100" width="250.0" height="220" rx="10" fill="#ffffff" stroke="#c9c6bb"/><text x="640.0" y="150" font-family="Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#1f5a3a">3. Year 2</text><text x="640.0" y="190" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#333">Surveillance</text><text x="640.0" y="220" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#333">audit.</text><path d="M878.0 210 h24 m-8 -8 l8 8 l-8 8" fill="none" stroke="#1f5a3a" stroke-width="3"/><rect x="910.0" y="100" width="250.0" height="220" rx="10" fill="#ffffff" stroke="#c9c6bb"/><text x="930.0" y="150" font-family="Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#1f5a3a">4. Year 3</text><text x="930.0" y="190" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#333">Surveillance audit,</text><text x="930.0" y="220" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#333">then recertify.</text></svg>