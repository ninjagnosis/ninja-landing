stages:
  - verify

variables:
  NODE_VERSION: "22"

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/

# Cloudflare Workers Builds builds and deploys from this repository, so this
# pipeline only checks that the site builds, passes the audit and the tests.
verify:
  stage: verify
  image: node:${NODE_VERSION}-trixie
  before_script:
    - corepack enable
    - pnpm install --frozen-lockfile
  script:
    - pnpm test
    - pnpm build
    - pnpm check
  rules:
    - if: $CI_COMMIT_BRANCH
